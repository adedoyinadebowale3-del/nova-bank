<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile | NOVA BANK DEMO</title><link rel="stylesheet" href="../style.css"></head>
<body><div class="demo-banner">DEMO PROFILE · Fictional information only</div><div class="dashboard-layout"><aside class="sidebar"><a href="../index.html" class="logo"><span>✦</span> NOVA BANK</a><nav><a href="dashboard.html">▦ &nbsp; Overview</a><a href="transfers.html">↗ &nbsp; Transfers</a><a href="transactions.html">◷ &nbsp; Transactions</a><a href="cards.html">▣ &nbsp; My Cards</a><a href="payments.html">▤ &nbsp; Payments</a><a class="active" href="profile.html">◉ &nbsp; My Profile</a><a href="../index.html">↩ &nbsp; Exit Demo</a></nav></aside><main class="dash-main"><div class="dash-top"><div><p>ACCOUNT SETTINGS</p><h1>My profile</h1><p>Your fictional demo profile details.</p></div></div><section class="panel page-panel"><h2>Personal details</h2><p>These details exist only for this browser session.</p><div class="profile-details" id="profileDetails"></div><button class="button-primary" id="exitButton" type="button" style="margin-top:20px">Exit Demo</button></section></main></div><script>const p=JSON.parse(sessionStorage.getItem("novaDemoProfile")||"null");if(!p){document.getElementById("profileDetails").textContent="No demo profile found. Please create a demo account first."; }else{const items=[["Full name",(p.firstName+" "+p.lastName).trim()],["Demo email",p.email],["Demo account number",p.accountNumber],["Account type","Nova Everyday (Demo)"],["Account status","Presentation only"],["Security","No real authentication"]];document.getElementById("profileDetails").innerHTML=items.map(([k,v])=>`<div class="profile-item"><small>${k}</small><strong></strong></div>`).join("");document.querySelectorAll(".profile-item strong").forEach((el,i)=>el.textContent=items[i][1]);}document.getElementById("exitButton").addEventListener("click",()=>{sessionStorage.removeItem("novaDemoProfile");sessionStorage.removeItem("novaDemoBalance");window.location.href="../index.html";});</script></body></html>
